{% extends "base.html" %}

{% load static %}

{% block content %}

<ul class="lista-torneos">
    {% for juegos in torneos %}
        {% if juegos.juego == "Rocket League" %}
            <li class="tarjeta"><a href="{% url 'torneo_rl' %}">{{ juegos }}</a></li>
        {% else %}
            <li class="tarjeta proximamente">{{ juegos }}</li>
        {% endif %}
    {% endfor %}
</ul>

{% endblock %}
