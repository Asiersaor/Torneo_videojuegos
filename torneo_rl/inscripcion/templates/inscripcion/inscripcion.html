{% extends "base.html" %}

{% block content %}
<div class="pagina-form">
    <div class="tarjeta-form">
        <h2>Inscripcion</h2>
        <p class="subtitulo">Inscribete y compite contra otros jugadores dispuestos a darlo todo por ser los ganadores.</p>
        <form action="" method="post">
            {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Inscribirse</button>
        </form>
        <a href="{% url 'home' %}">Volver al inicio</a>
    </div>
</div>
{% endblock %}
